<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoConecta - Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="p-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img src="./logo.png" class="navbar-logo" alt="Logo">
            </div>
            <nav class="nav">
                <a class="nav-link text-white fw-bold" href="index.html">Home</a>
                <a class="nav-link text-white fw-bold" href="simulacao.html">Simulação</a>
                <a class="nav-link text-white fw-bold" href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h2 class="text-success mb-4">Fale Conosco</h2>
                    <div class="mb-3">
                        <label class="form-label">Seu Nome</label>
                        <input type="text" id="nome" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Seu E-mail</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mensagem</label>
                        <textarea id="mensagem" class="form-control" rows="3"></textarea>
                    </div>
                    <button onclick="enviarMensagem()" class="btn btn-success w-100">Enviar Mensagem</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center p-4 mt-5">
        <p class="m-0">Global Solution 2026 - EcoConecta Orbital</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
